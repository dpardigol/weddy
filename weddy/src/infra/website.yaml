AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Static wedding website hosted on a private S3 bucket
  and delivered through CloudFront with HTTPS and Route 53.

Parameters:

  DomainName:
    Type: String
    Description: "Domain name of the website, e.g. dev.weddy.click"

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: "Route 53 hosted zone ID for weddy.click"

  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN used by CloudFront.
      The certificate must exist in us-east-1.


Resources:

  #####################################
  # S3 BUCKET
  #####################################

  WebsiteBucket:
    Type: AWS::S3::Bucket

    Properties:

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled


  #####################################
  # CLOUDFRONT ORIGIN ACCESS CONTROL
  #####################################

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl

    Properties:

      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"

        Description: >
          Origin Access Control used by CloudFront
          to securely access the private S3 bucket.

        OriginAccessControlOriginType: s3

        SigningBehavior: always

        SigningProtocol: sigv4


  #####################################
  # CLOUDFRONT DISTRIBUTION
  #####################################

  Distribution:
    Type: AWS::CloudFront::Distribution

    Properties:

      DistributionConfig:

        Enabled: true

        Comment: !Sub "CloudFront distribution for ${DomainName}"

        DefaultRootObject: index.html

        HttpVersion: http2

        PriceClass: PriceClass_100


        #################################
        # CUSTOM DOMAIN
        #################################

        Aliases:
          - !Ref DomainName


        #################################
        # HTTPS CERTIFICATE
        #################################

        ViewerCertificate:

          AcmCertificateArn: !Ref CertificateArn

          SslSupportMethod: sni-only

          MinimumProtocolVersion: TLSv1.2_2021


        #################################
        # S3 ORIGIN
        #################################

        Origins:

          - Id: WebsiteS3Origin

            DomainName: !GetAtt WebsiteBucket.RegionalDomainName

            OriginAccessControlId: !GetAtt OriginAccessControl.Id

            S3OriginConfig:
              OriginAccessIdentity: ""


        #################################
        # DEFAULT CACHE BEHAVIOR
        #################################

        DefaultCacheBehavior:

          TargetOriginId: WebsiteS3Origin

          ViewerProtocolPolicy: redirect-to-https

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          Compress: true

          ForwardedValues:

            QueryString: false

            Cookies:
              Forward: none


  #####################################
  # S3 BUCKET POLICY
  #
  # Allows only this CloudFront
  # distribution to read S3 objects.
  #####################################

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:

      Bucket: !Ref WebsiteBucket

      PolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Sid: AllowCloudFrontServicePrincipal

            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource: !Sub "${WebsiteBucket.Arn}/*"

            Condition:

              StringEquals:

                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"


  #####################################
  # ROUTE 53
  #####################################

  DNSRecord:
    Type: AWS::Route53::RecordSet

    Properties:

      HostedZoneId: !Ref HostedZoneId

      Name: !Ref DomainName

      Type: A

      AliasTarget:

        DNSName: !GetAtt Distribution.DomainName

        # Fixed Route 53 hosted zone ID
        # used for all CloudFront distributions.
        HostedZoneId: Z2FDTNDATAQYW2

  WebsiteBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: /weddy/dev/website-bucket
      Type: String
      Value: !Ref WebsiteBucket
      Description: S3 bucket containing the Weddy development website


  CloudFrontDistributionParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: /weddy/dev/cloudfront-distribution-id
      Type: String
      Value: !Ref Distribution
      Description: CloudFront distribution ID for the Weddy development website

Outputs:

  WebsiteBucketName:

    Description: S3 bucket used to store the generated static website

    Value: !Ref WebsiteBucket

    Export:
      Name: WeddyDevWebsiteBucketName


  WebsiteBucketArn:

    Description: ARN of the S3 website bucket

    Value: !GetAtt WebsiteBucket.Arn

    Export:
      Name: WeddyDevWebsiteBucketArn


  CloudFrontDistributionId:

    Description: CloudFront distribution ID

    Value: !Ref Distribution

    Export:
      Name: WeddyDevCloudFrontDistributionId


  CloudFrontDomain:

    Description: CloudFront-generated domain name

    Value: !GetAtt Distribution.DomainName


  WebsiteURL:

    Description: Public HTTPS URL of the wedding website

    Value: !Sub "https://${DomainName}"